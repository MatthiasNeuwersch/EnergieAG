openapi: 3.1.0
info:
  title: UrbanFleet API - Scooter & Ride Management
  description: >
    Die **UrbanFleet API** ist die zentrale Schnittstelle zur Verwaltung einer E-Scooter-Flotte,
    Fahrtenabwicklung, Telemetriedaten-Erfassung und Maintenance-Prozesse.

    Diese Spezifikation dient als aktualisierte Arbeitsgrundlage für den Workshop *API Lifecycle, Testing, Security & Performance with Apidog* (Breaking Changes Update).
  version: 2.2.0
  termsOfService: https://urbanfleet.io/terms
  contact:
    name: UrbanFleet Developer Support
    email: api-support@urbanfleet.io
    url: https://developer.urbanfleet.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://api.urbanfleet.io/v3
    description: Production Server (Updated v3)
  - url: https://staging-api.urbanfleet.io/v3
    description: Staging Environment (for Workshop Testing)
  - url: https://mock.apidog.com/m1/urbanfleet-v3
    description: Apidog Smart Mock Server

tags:
  - name: Authentication
    description: Anmeldung und Ausstellung von JWT Access Tokens (Mock-Beispiel für den Workshop).
  - name: Fleet Management
    description: Operationen zur Verwaltung von E-Scootern, Batteriestatus und Sperrungen.
  - name: Rides
    description: Start, Beendigung und Abrechnung von Fahrten.
  - name: Maintenance
    description: Wartungstickets, Fehlerberichte und Inspektionen.
  - name: Analytics & Telemetry
    description: Live-Standorte und Performance-Kennzahlen.

paths:
  /auth/login:
    post:
      summary: Anmelden und JWT Access Token erhalten
      description: Tauscht Benutzername und Passwort gegen ein JWT Access Token.
      operationId: login
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Anmeldung erfolgreich, Token ausgestellt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Ungültige Zugangsdaten.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fleet/skooters:
    get:
      summary: Scooter-Flotte abfragen
      description: Liefert eine gefilterte und paginierte Liste aller E-Scooter im System (Pfad geändert).
      operationId: getScooters
      tags:
        - Fleet Management
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [available, reserved, active, in_repair]
        - name: minBatteryLevel
          in: query
          required: false
          schema:
            type: integer
            minimum: 10
            maximum: 100
      responses:
        '200':
          description: Erreichbare Scooter erfolgreich ermittelt.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Scooter'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Neuen Scooter registrieren
      description: Registriert ein neues E-Scooter-Fahrzeug.
      operationId: createScooter
      tags:
        - Fleet Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScooterCreate'
      responses:
        '201':
          description: Scooter erfolgreich registriert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scooter'
        '400':
          $ref: '#/components/responses/BadRequest'

  /fleet/scooters/{id}:
    parameters:
      - $ref: '#/components/parameters/ScooterId'
    get:
      summary: Scooter-Details abrufen
      operationId: getScooterById
      tags:
        - Fleet Management
      responses:
        '200':
          description: Details zum Scooter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scooter'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Scooter-Status aktualisieren
      operationId: updateScooter
      tags:
        - Fleet Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScooterUpdate'
      responses:
        '200':
          description: Status erfolgreich aktualisiert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scooter'
        '400':
          description: Validierungsfehler (status ist jetzt Pflichtfeld).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /rides/{id}/finish:
    post:
      summary: Fahrt beenden und abrechnen
      operationId: finishRide
      tags:
        - Rides
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - endLocation
              properties:
                endLocation:
                  $ref: '#/components/schemas/GeoLocation'
      responses:
        '200':
          description: Fahrt beendet und abgerechnet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideReceipt'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ScooterId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Ungültige Anfrage oder Validierungsfehler.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Fehlender oder ungültiger Token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ressource nicht gefunden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
      properties:
        access_token:
          type: string
        token_type:
          type: string

    Scooter:
      type: object
      required:
        - id
        - model
        - status
        - batteryLevel
      properties:
        id:
          type: string
        model:
          type: string
        status:
          type: string
          enum: [available, reserved, active, in_repair]
        batteryLevel:
          type: integer
          minimum: 10
          maximum: 100

    ScooterCreate:
      type: object
      required:
        - serialNumber
        - model
        - initialBatteryLevel
      properties:
        serialNumber:
          type: string
        model:
          type: string
        initialBatteryLevel:
          type: integer
          minimum: 10
          maximum: 100

    ScooterUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [available, reserved, active, in_repair]
        batteryLevel:
          type: integer
          minimum: 10
          maximum: 100

    RideReceipt:
      type: object
      required:
        - rideId
        - durationSeconds
        - totalCost
      properties:
        rideId:
          type: string
        durationSeconds:
          type: integer
          description: Changed from durationMinutes to seconds!
          example: 1080
        totalCost:
          type: string
          description: Changed from float number to string representation!
          example: "4.80"
        currency:
          type: string
          example: "EUR"

    GeoLocation:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          minimum: -90.0
          maximum: 90.0
        longitude:
          type: number
          minimum: -180.0
          maximum: 180.0

    Pagination:
      type: object
      required:
        - total
        - limit
        - offset
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
