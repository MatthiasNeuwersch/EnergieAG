openapi: 3.0.1
info:
  title: Usedcar
  description: ''
  version: 1.0.0
tags:
  - name: Authentication
paths:
  /auth/login:
    post:
      summary: Anmelden und JWT Access Token erhalten
      deprecated: false
      description: >
        Tauscht Benutzername und Passwort gegen ein JWT Access Token (und
        Refresh Token). Der Endpunkt ist öffentlich und benötigt keinen
        Authorization-Header.

        **Mock-Hinweis:** Das Beispiel `ValidLogin` liefert in der Antwort ein
        statisches Test-JWT. Dieses Token kann anschließend als `Authorization:
        Bearer <token>` an geschützten Endpunkten (z. B. `GET /scooters`)
        verwendet werden.
      operationId: login
      tags:
        - Authentication
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              ValidLogin:
                value:
                  username: alice@example.com
                  password: secret
                summary: Gültige Zugangsdaten (liefert 200 mit Token)
              InvalidLogin:
                value:
                  username: unknown@example.com
                  password: wrong
                summary: Ungültige Zugangsdaten (liefert 401)
        required: true
      responses:
        '200':
          description: Anmeldung erfolgreich, Token ausgestellt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Ungültige Zugangsdaten.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
      security: []
  /cars:
    get:
      summary: Alle Gebrauchtwagen abrufen
      deprecated: false
      description: >-
        Liefert aktuell ungeregelt alle Autos inklusive kompletter Historie und
        Händlerdetails zurück.
      tags: []
      parameters: []
      responses:
        '200':
          description: Riesen-Liste aller Fahrzeuge
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarUnoptimized'
          headers: {}
      security: []
    post:
      summary: Neuen Gebrauchtwagen inserieren
      deprecated: false
      description: ''
      tags: []
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarInputUnoptimized'
        required: true
      responses:
        '201':
          description: Erfolgreich erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarUnoptimized'
          headers: {}
      security: []
  /cars/{id}:
    get:
      summary: Details zu einem Fahrzeug abrufen
      deprecated: false
      description: ''
      tags: []
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: integer
      responses:
        '200':
          description: Fahrzeugdetails gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarUnoptimized'
          headers: {}
        '404':
          description: Nicht gefunden
          headers: {}
      security: []
    delete:
      summary: Inserat löschen
      deprecated: false
      description: ''
      tags: []
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: integer
      responses:
        '204':
          description: Gelöscht
          headers: {}
      security: []
components:
  schemas:
    CarUnoptimized:
      type: object
      properties:
        id:
          type: integer
          examples:
            - 1042
        internalTrackingUuid:
          type: string
          examples:
            - a8f5c823-91b4-4f81-9872-234b5c678901
        brand:
          type: string
          examples:
            - Volkswagen
        model:
          type: string
          examples:
            - Golf VII Variant Highline
        trimLevel:
          type: string
          examples:
            - 2.0 TDI SCR BlueMotion Technology
        year:
          type: integer
          examples:
            - 2018
        mileageInKilometers:
          type: integer
          examples:
            - 145230
        priceInCents:
          type: integer
          examples:
            - 1450000
        currency:
          type: string
          examples:
            - EUR
        rawDescriptionHtml:
          type: string
          examples:
            - >-
              <div style='font-family:Arial;'><b>Top Zustand!</b>
              Scheckheftgepflegt bei VW Partner. Unfallfrei. Keine Garantie da
              Privatverkauf... [hier folgen noch 2000 Zeichen
              Marketing-Text]</div>
        dealerInformation:
          type: object
          properties:
            dealerId:
              type: integer
              examples:
                - 509
            dealerName:
              type: string
              examples:
                - Auto Zentrum Süd GmbH & Co. KG
            dealerFullAddress:
              type: string
              examples:
                - Musterstraße 123, 10115 Berlin, Deutschland
            dealerTaxId:
              type: string
              examples:
                - DE123456789
            dealerSupportHotline:
              type: string
              examples:
                - +49 30 55501928
            dealerRatingAverage:
              type: number
              examples:
                - 4.78
            dealerActiveContractsCount:
              type: integer
              examples:
                - 42
        previousOwnersHistory:
          type: array
          items:
            type: object
            properties:
              ownerIndex:
                type: integer
                examples:
                  - 1
              durationMonths:
                type: integer
                examples:
                  - 36
              usageType:
                type: string
                examples:
                  - Company Leasing
              lastKnownRegion:
                type: string
                examples:
                  - Bavaria, Germany
        inspectionLogisticsMetadata:
          type: object
          properties:
            lastInspectionDate:
              type: string
              examples:
                - '2025-05-12T10:00:00Z'
            inspectorId:
              type: string
              examples:
                - TUEV-SUD-99482
            nextRecommendedCheck:
              type: string
              examples:
                - '2027-05-12T00:00:00Z'
            brakesConditionPercent:
              type: integer
              examples:
                - 85
            tiresTreadDepthMm:
              type: number
              examples:
                - 5.5
    CarInputUnoptimized:
      type: object
      required:
        - brand
        - model
        - year
        - priceInCents
        - dealerInformation
      properties:
        brand:
          type: string
          examples:
            - BMW
        model:
          type: string
          examples:
            - 320d Touring
        year:
          type: integer
          examples:
            - 2020
        priceInCents:
          type: integer
          examples:
            - 2490000
        rawDescriptionHtml:
          type: string
          examples:
            - Fahrzeug in Top-Zustand.
        dealerInformation:
          type: object
          properties:
            dealerId:
              type: integer
              examples:
                - 509
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          examples:
            - alice@example.com
        password:
          type: string
          format: password
          examples:
            - secret
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: JWT Access Token
          examples:
            - >-
              eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
        refresh_token:
          type: string
          examples:
            - mock-refresh-5f0c2c1e-7d1a-4a43-9c55-0e6f6a1b2d33
        token_type:
          type: string
          examples:
            - Bearer
        expires_in:
          type: integer
          description: Gültigkeit des Access Tokens in Sekunden
          examples:
            - 3600
    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
          examples:
            - VALIDATION_ERROR
        message:
          type: string
          examples:
            - Fehlerhafte Parameter in der Anfrage.
        timestamp:
          type: string
          format: date-time
          examples:
            - '2026-10-13T10:42:00Z'
  responses:
    BadRequest:
      description: Ungültige Anfrage oder Validierungsfehler.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Success:
              summary: Success
              value:
                code: INVALID_INPUT
                message: Das Feld 'minBatteryLevel' muss zwischen 0 und 100 liegen.
                timestamp: '2026-10-13T10:00:00Z'
  securitySchemes: {}
  parameters:
    ScooterId:
      name: id
      in: path
      required: true
      description: Eindeutige Kennung des E-Scooters
      schema:
        type: string
        example: scoot-8821
servers: []
security: []
